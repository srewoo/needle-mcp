[project]
name = "needle-mcp"
version = "0.1.0"
description = "Generic, credential-free MCP server for RCA investigation, composing with whatever vendor MCPs are already connected."
requires-python = ">=3.11"
dependencies = [
    # The <2 pin is load-bearing: mcp 2.x deleted mcp.server.fastmcp (FastMCP was
    # renamed to MCPServer). Every import in this project assumes the 1.x layout.
    "mcp>=1.9.0,<2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
needle-mcp = "needle_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/needle_mcp"]

# The methodology skill must ship inside the wheel: on a non-Claude-Code host it
# is the ONLY way the five rules and the envelope schema reach the session (as an
# MCP prompt + resource), and a `uvx needle-mcp` install has no repo checkout to
# fall back to.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "needle_mcp/skills"
